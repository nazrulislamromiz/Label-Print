<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Romiz Size Level Printer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: min(430px, 92%);
      margin: 35px auto;
      background: #ffffff;
      padding: 28px 24px 22px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 28px;
      font-size: 26px;
      color: #333;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      color: #555;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 0 15px;
      font-size: 18px;
      outline: none;
      margin-bottom: 22px;
    }

    input:focus {
      border-color: #2196f3;
    }

    .preview-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0 14px;
    }

    .preview {
      width: 190px;
      height: 125px;
      margin: 0 auto 22px;
      border: 1px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }

    #previewText {
      font-size: 25px;
      font-weight: 700;
      color: #111;
      text-align: center;
      word-break: break-word;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 6px;
      background: #2196f3;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1976d2;
    }

    .contact {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      font-size: 15px;
    }

    .contact a {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 15px;
      border-radius: 6px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .hint {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Label Printer</h1>

    <label for="sizeText">
      Size Text (e.g. 16-20)
    </label>

    <input
      id="sizeText"
      type="text"
      value="16-20"
      placeholder="16-20"
    >

    <label for="quantity">
      Quantity
    </label>

    <input
      id="quantity"
      type="number"
      min="1"
      value="1"
    >

    <div class="preview-title">
      Preview (38mm x 25mm)
    </div>

    <div class="preview">
      <div id="previewText">16-20</div>
    </div>

    <button onclick="printLabels()">
      Print Labels
    </button>

    <div class="contact">
      <strong>যোগাযোগ</strong><br>

      <a
        href="https://wa.me/8801734050726"
        target="_blank"
      >
        WhatsApp: 01734050726
      </a>
    </div>

    <div class="hint">
      Size লিখুন → Quantity দিন → Print Labels চাপুন
    </div>

  </div>


  <script>

    const sizeInput =
      document.getElementById("sizeText");

    const previewText =
      document.getElementById("previewText");


    sizeInput.addEventListener("input", function () {

      previewText.textContent =
        sizeInput.value || "16-20";

    });


    function printLabels() {

      const text =
        sizeInput.value.trim();

      const quantity =
        Math.max(
          1,
          parseInt(
            document.getElementById("quantity").value
          ) || 1
        );


      if (!text) {

        alert("Please enter Size Text.");

        return;
      }


      let labels = "";


      for (let i = 0; i < quantity; i++) {

        labels +=
          `<div class="label">${escapeHtml(text)}</div>`;

      }


      const win =
        window.open("", "_blank");


      win.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

          <title>Print Labels</title>

          <style>

            @page {
              size: 38mm 25mm;
              margin: 0;
            }

            * {
              box-sizing: border-box;
            }

            html,
            body {
              margin: 0;
              padding: 0;
            }

            .label {

              width: 38mm;

              height: 25mm;

              display: flex;

              align-items: center;

              justify-content: center;

              font-family: Arial, sans-serif;

              font-size: 24px;

              font-weight: 700;

              page-break-after: always;

              overflow: hidden;

              text-align: center;

            }

          </style>

        </head>

        <body>

          ${labels}

        </body>

        </html>

      `);


      win.document.close();

      win.focus();


      setTimeout(function () {

        win.print();

      }, 300);

    }


    function escapeHtml(str) {

      return str.replace(
        /[&<>"']/g,
        function (m) {

          return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[m];

        }
      );

    }

  </script>

</body>
</html>
